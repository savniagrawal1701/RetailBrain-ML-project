# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: retailbrain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
